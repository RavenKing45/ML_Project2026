# Hyper-parameter search spaces per model. Every technique is tuned over the same space
# with the same budget (experiment.yaml: tuning.n_iter).
logreg:
  C: [0.001, 0.01, 0.1, 1, 10]
  max_iter: [2000]
random_forest:
  n_estimators: [200]
  max_depth: [8, 12, 16, null]
  min_samples_leaf: [1, 5, 20]
  max_features: [sqrt, 0.5]
  max_samples: [0.5, null]
lightgbm:
  n_estimators: [200, 400]
  learning_rate: [0.03, 0.1]
  num_leaves: [15, 31, 63]
  min_child_samples: [20, 50]
  subsample: [0.8, 1.0]
  subsample_freq: [1]
  colsample_bytree: [0.8, 1.0]
