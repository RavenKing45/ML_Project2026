seed: 42
test_size: 0.30
cv_folds: 5
cv_repeats: 3
primary_metric: average_precision
techniques: [baseline, ros, rus, smote, smote_rus, class_weight]
models: [logreg, random_forest, lightgbm]
ratio_grid: [0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
hybrid: {smote_ratios: [0.005, 0.01, 0.05], rus_ratios: [0.1, 0.5, 1.0]}
smote_k_neighbors: 5
tuning: {n_iter: 20}
parallel: {model_n_jobs: -1, search_n_jobs: 1}   # models use all cores; CV/search fits run one at a time (memory)
quick: {train_fraction: 0.10, cv_folds: 3, n_iter: 3, cv_repeats: 1}
threshold: {objectives: [f1, f2]}
bootstrap: {n_resamples: 1000, confidence: 0.95}
stats: {alpha: 0.05}   # Wilcoxon (Holm), Friedman and Nemenyi CD in scripts/run_stats.py
# Deployable subset for the backend (scripts/export_artifacts.py; master guide Parts 9 and 11).
# Only logreg and LightGBM fit on the 512 MB server; random forest stays in the JSON results.
# "logreg__<technique>" means logistic regression with the default cell's technique.
deploy:
  cells: [lightgbm__baseline, lightgbm__ros, lightgbm__rus, lightgbm__smote, lightgbm__smote_rus, lightgbm__class_weight, logreg__<technique>]
  default_cell: null        # the TEAM chooses it from the CV results; never picked automatically
  default_threshold: f1     # tuned threshold the backend applies when a request gives none
  calibrate: true           # isotonic calibrator per cell, fitted on its out-of-fold scores
  max_file_mb: 50           # warn above this per file (free server: 512 MB RAM)
  presets: {everyday_amount: [5, 50], small_amount_max: 5, large_amount_quantile: 0.99, borderline_window: 0.05}
  demo_batch: {rows: 500, frauds: 25}   # test rows; fraud share enriched (5% vs 0.17%), so batch precision is optimistic
  input_range_percentiles: [0.1, 99.9]   # /predict warns when an input lies outside this percentile range of the training rows
