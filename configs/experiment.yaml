seed: 42
test_size: 0.30
cv_folds: 5
cv_repeats: 3
primary_metric: average_precision
techniques: [baseline, ros, rus, smote, smote_rus, class_weight]
models: [logreg, random_forest, lightgbm]
ratio_grid: [0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
hybrid: {smote_ratios: [0.005, 0.01, 0.05], rus_ratios: [0.1, 0.5, 1.0]}
smote_k_neighbors: 5
tuning: {n_iter: 20}
parallel: {model_n_jobs: -1, search_n_jobs: 1}   # models use all cores; CV/search fits run one at a time (memory)
quick: {train_fraction: 0.10, cv_folds: 3, n_iter: 3, cv_repeats: 1}
threshold: {objectives: [f1, f2]}
bootstrap: {n_resamples: 1000, confidence: 0.95}
use_hour_feature: false   # optional side test; assumes Time=0 is midnight (unverified)
